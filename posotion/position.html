<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
    }

    body {
        margin: 0px;
        
    }

    .main1 {
        width: 100vw;
        height: 100vh;

    }

    #main_image {
        width: 100vw;
        height: 100vh;

    }

    .sub11 {
        position: absolute;
        right: 50px;
        top: 50px;
    }

    .sub11 img {
        width: 150px;
    }


    .sub11 img {
        mix-blend-mode: multiply;
    }

    .sub12 img{
        position :absolute;
        left: 50px;
        top: 30px;
        height: 180px;
        width: 300px;
        
    }
    .sub13{
        position: absolute;
        top: 180px;
        left: 50px;
        font-size: x-large;
        color: brown;
        
    }
    .sub13 td{
        padding: 3px;
        color:rgb(93, 89, 89);
        transition: all 0.5s ease;
        margin-left: 8px;
        font-size: x-large;

    }
    .sub13 td:hover {
      transform: translateX(8px);

    }
    .div14{
        position: absolute;
        top: 70vh;
        left: 25vw;
        font-size: 70px;
        color: rgb(128, 120, 120);
        opacity: 0.5 ;
        transition: all .5s ease;
        
    }
    .div14 .h2:hover{
         transform: translateY(20px);


    }




   




</style>

<body>
    <div class="main1">
        <img src="https://w0.peakpx.com/wallpaper/806/591/HD-wallpaper-bugatti-veyron-black-red-bugatti-veyron.jpg"
            alt="" id="main_image">

        <div class="sub11">
            <img src="./logo.png"
                alt="#">

        </div>
        <div class="sub12">
            <img src = "./name.png"
                alt="#">
        </div>
        <div class="sub13">
            <table>

                <tr>
                    <td>Home</td>
                </tr>

                <tr>
                    <td>Booking</td>
                </tr>

                <tr>
                    <td>Models</td>
                </tr>

                <tr>
                    <td>Racing</td>
                </tr>

                <tr>
                    <td>About</td>
                </tr>


            </table>

        </div>
    <div class="div14">
        <h2 class="h2">Bugatti<span style="color: red;"> Veyron</span></h2>
    </div>
    </div>
    



</body>

</html>
